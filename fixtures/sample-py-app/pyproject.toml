[project]
name = "sample-app"
version = "0.3.1"
description = "Team project tracker with monthly usage reports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sample-app = "sample_app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sample_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
